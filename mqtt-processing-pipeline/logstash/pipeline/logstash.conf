input {
  # Gateway events (decoded from Protobuf to JSON by the Python bridge)
  mqtt {
    host => ""
    port => 1883
    topic => "chirpstack-json/#"
  }

  # Application events (JSON from ChirpStack)
  mqtt {
    host => ""
    port => 1883
    topic => "application/#"
  }
}

filter {
  json {
    source => "message"
  }
}

output {
  gelf {
    host => ""
    port => 12202
    protocol => "TCP"
    short_message => "%{topic}"
  }
}
