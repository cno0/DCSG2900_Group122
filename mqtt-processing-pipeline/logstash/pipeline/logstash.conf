input {
  # Gateway events (decoded from Protobuf to JSON by the Python bridge)
  mqtt {
    host => "" # Specify MQTT broker IP
    port => 1883
    topic => "chirpstack-json/#"
  }

  # Application events (JSON from ChirpStack)
  mqtt {
    host => "" # Specify MQTT broker IP
    port => 1883
    topic => "application/#"
  }
}

filter {
  json {
    source => "message"
  }
}

output {
  gelf {
    host => "" # Specify SIEM IP 
    port =>    # Specify SIEM input port
    protocol => "TCP"
    short_message => "%{topic}"
  }
}
